<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <link rel="stylesheet" href="style.css">
<!-- Include Canvas Confetti for confetti effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Section 1: "Do You Love Me?" -->
        <div id="page1">
            <img id="gif"
                src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTgyaGlieHM2bTRoZWZ3eHN5enk4dDNweHNibzYzMHA1eHV4eHhwYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/8vL92ykY64CurPrmEH/giphy.gif"
                alt="Cute GIF">

            <h1 id="question">Do you love me? 💖</h1>
            <!-- Yes/No but  -->
            <div class="btn-group">
                <button id="yes-btn">Yes</button>
                <button id="no-btn">No</button>
            </div>
        </div>
    <!-- Floating Hearts Backdrop -->
    <div class="hearts-background">
        <div class="heart" style="left: 10%; animation-delay: 0s;">💖</div>
        <div class="heart" style="left: 25%; animation-delay: 2s; font-size: 1.5rem;">💕</div>
        <div class="heart" style="left: 40%; animation-delay: 4s;">🌸</div>
        <div class="heart" style="left: 60%; animation-delay: 1s; font-size: 2rem;">💗</div>
        <div class="heart" style="left: 75%; animation-delay: 3s;">✨</div>
        <div class="heart" style="left: 88%; animation-delay: 5s; font-size: 1.5rem;">💖</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
